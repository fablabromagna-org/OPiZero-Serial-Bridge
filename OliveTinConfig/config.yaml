# There is a built-in micro proxy that will host the webui and REST API all on
# one port (this is called the "Single HTTP Frontend") and means you just need
# one open port in the container/firewalls/etc.
#
# Listen on all addresses available, port 1337.
# If the PORT environment variable is set, it overrides this port (host is kept).
listenAddressSingleHTTPFrontend: 0.0.0.0:1337

# Choose from INFO (default), WARN and DEBUG
# Docs: https://docs.olivetin.app/advanced_configuration/logs.html
logLevel: "DEBUG"
themeName: catppuccin-mocha-olivetin 


pageTitle: OrangePi-Zero

# Actions are commands that are executed by OliveTin, and normally show up as
# buttons on the WebUI.
#
# Docs: https://docs.olivetin.app/action_buttons/create_your_first.html
actions:
  - title: Disconnect WiFi
    id: wifi_disconnect
    shell: nmcli connection down $(cat /run/network-state/connection   2>/dev/null)
    icon: '<img src = "custom-webui/icons/wifi_disconnect.png" />'
    onclick: execution-dialog
  
  - title: Disconnect and forget WiFi
    id: wifi_delete
    shell: nmcli connection delete $(cat /run/network-state/connection   2>/dev/null)
    icon: '<img src = "custom-webui/icons/wifi_disconnect.png" />'
    justification: " "
    arguments:
      - type: confirmation
        title: Are you sure?!
    onclick: execution-dialog


  # Lots of people also use OliveTin to monitor their servers, like checking
  # disk space, or checking logs. `onclick: execution-dialog` shows output.
  - title: Check disk space
    icon: disk
    shell: df -h /
    onclick: execution-dialog

  # Every action can still be run on demand from the web UI or API. The keys
  # below are optional *additional* triggers (see each action and
  # https://docs.olivetin.app/action_execution/ ).
  #
  # This is the most simple action, it just runs the command and flashes the
  # button to indicate status.
  #
  # If you are running OliveTin in a container remember to pass through the
  # docker socket! https://docs.olivetin.app/solutions/container-control-panel/index.html
  - title: Ping the Internet
    shell: ping -c 3 1.1.1.1
    icon: ping
    onclick: execution-dialog
    # https://docs.olivetin.app/action_execution/onstartup.html
    execOnStartup: true

  # When you want to prompt users for input, that is when you should use
  # `arguments` - this presents a popup dialog and asks for argument values.
  #
  # Docs: https://docs.olivetin.app/action_examples/ping.html
  - title: Ping host
    id: ping_host
    shell: ping {{ host }} -c {{ count }}
    icon: ping
    timeout: 100
    onclick: history
    # https://docs.olivetin.app/action_execution/onwebhook.html — POST to /webhooks
    # with header X-OliveTin-Demo: ping-host (path and payload rules are documented).
    execOnWebhook:
      - matchHeaders:
          X-OliveTin-Demo: ping-host
    arguments:
      - name: host
        title: Host
        type: ascii_identifier
        default: example.com
        description: The host that you want to ping

      - name: count
        title: Count
        type: int
        default: 3
        description: How many times to do you want to ping?
  


  # Sometimes you want to run actions on other servers - don't overcomplicate
  # it, just use SSH! OliveTin includes a helper to make this easier, which is
  # entirely optional. You can also setup SSH manually.
  #
  # Docs: https://docs.olivetin.app/action_examples/ssh-easy.html
  # Docs: https://docs.olivetin.app/action_examples/ssh-manual.html
  - title: "Setup easy SSH"
    icon: ssh
    shell: olivetin-setup-easy-ssh
    onclick: execution-dialog
    # Second webhook example: POST /webhooks?demo=setup-ssh
    execOnWebhook:
      - matchQuery:
          demo: setup-ssh

  # ################################# 
  # Espressif Commands and utilities
  # ################################# 
  - title: Refresh serial ports
    id: serial_ports_refresh
    shell: /opt/custom-scripts/refresh_serial_ports.sh
    timeout: 5
    icon: '<img src="custom-webui/icons/refresh.png" />'
    onclick: execution-dialog

  - title: Start ser2net Server
    id: ser2net_start
    entity: serial_port
    shell: killall ser2net; killall esp_rfc2217_server; nohup /opt/custom-env/start_ser2net.sh {{ .CurrentEntity.device }} 115200 > /var/log/esp_ser2net.log 2>&1 &
    timeout: 10
    icon: '<img src = "custom-webui/icons/connected.png" />'
    onclick: execution-dialog
  
  - title: Start RFC2217 Server
    id: rfc2217_start
    entity: serial_port
    shell:  killall ser2net; killall esp_rfc2217_server; nohup /opt/custom-env/bin/esp_rfc2217_server -p 4000 {{ .CurrentEntity.device }} > /var/log/esp_rfc2217.log 2>&1 &
    timeout: 10
    icon: '<img src = "custom-webui/icons/connected.png" />'
    onclick: execution-dialog

          
  - title: Stop RFC2217 Server
    id: rfc2217_stop
    shell: killall  esp_rfc2217_server 
    icon: '<img src = "custom-webui/icons/disconnected.png" />'
    #onclick: execution-dialog

  - title: Stop ser2net Server
    id: ser2net_stop
    shell: killall  ser2net
    icon: '<img src = "custom-webui/icons/disconnected.png" />'
    
  - title: Stop All Servers
    id: rfc2217_stop_all
    shell: killall  esp_rfc2217_server ; killall ser2net
    icon: '<img src = "custom-webui/icons/disconnected.png" />'

entities:
  - file: /etc/OliveTin/entities/serial_ports.yaml
    name: serial_port
    properties:
      - name: name
        title: Port
      - name: device
        title: Device


# Docs: https://docs.olivetin.app/dashboards/intro.html
dashboards:
  # Top level items are dashboards. Optional `category` groups them under
  # collapsible headings in the sidebar (same label = same group).
  - title: Espressif
    category: mcu
    contents:

      - type: view
        title: Start Serial Servers

      - type: fieldset
        entity: serial_port
 #       title: 'Serial port: {{ serial_port.name }}'
        contents:

          - type: display
            title: '<strong>{{ serial_port.device }}</strong>'
          
          - title: Start RFC2217 Server
          - title: Start ser2net Server

      - type: fieldset
        title: General RFC2217 Commands
        contents:
          - title: Stop RFC2217 Server
          - title: Stop ser2net Server
          - title: Stop All Servers
          - title: Refresh serial ports
 # - contents:
 #            - title: Refresh serial ports
 #             - title: Start RFC2217 Server
 #             - title: Stop RFC2217 Server
 #             - title: List USB ports



# Security - Authentication

# This setting effectively enables or disables guests.
# If set to "true", then users will have to login to do anything.
authRequireGuestsToLogin: false

# This form of auth is the simplest to setup - just define users and passwords
# in the config. OliveTin also supports header-based auth, OAuth2,
# and JWT authentication which are documented separately.
#
# Docs: https://docs.olivetin.app/security/local.html
#
# How to get a hashed password:
# Docs: https://docs.olivetin.app/security/local.html#_get_a_argon2id_hashed_password
authLocalUsers:
  enabled: true
#  users:
#    - username: alice
#      usergroup: admins
#      password: "$argon2id$v=19$m=65536,t=4,p=2$puyxA0s555TSFx7hnFLCXA$PyhLGpZtvpMMvc2DgMWkM8OJMKO55euwV5gm//1iwx4"

# Security - Access Control

# Policies affect the whole app (eg: ability to view the log list).
# Docs: https://docs.olivetin.app/security/acl.html
defaultPolicy:
  showDiagnostics: true
  showLogList: true

# Permissions affect actions (eg: ability to view a specific log).
# Docs: https://docs.olivetin.app/security/acl.html
defaultPermissions:
  view: true
  exec: true
  logs: true

# OliveTin uses access control lists to match up policy and permissions to users.
# Docs: https://docs.olivetin.app/security/acl.html
accessControlLists:
  - name: admin_acl
    matchUsergroups: ["admins"]
    policy:
      showDiagnostics: true
    permissions:
      view: true
      exec: true
      logs: true


